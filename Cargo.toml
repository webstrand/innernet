[workspace]
resolver = "2"

members = [
  "server",
  "client",
  "client-core",
  "domain",
  "node",
  "shared",
  "publicip",
  "netlink-request",
]

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = "s"
panic = "abort"

[workspace.package]
keywords = ["innernet", "networking", "overlay", "vpn", "wireguard"]

[workspace.dependencies]
colored = "2"
dialoguer = { version = "0.11", default-features = false }
netlink-packet-core = "0.8"
netlink-packet-generic = "0.4"
netlink-packet-route = "0.31"
netlink-packet-wireguard = "0.4"
netlink-sys = "0.8.5"
rusqlite = { version = "0.40.2", features = ["bundled", "fallible_uint"] }

# A server whose client verifier requires raw public keys must accept clients that offer no
# client certificate type, when client authentication is optional, so that tools such as curl
# can reach the public routes. Until rustls accepts the change, it comes from a fork.
[patch.crates-io]
rustls = { git = "https://github.com/webstrand/rustls", branch = "innernet-0.23.46" }
