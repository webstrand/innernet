[package]
authors = [
  "Jake McGinty <me@jakebot.org>",
  "Brian Schwind <brian@tonari.no>",
  "Ryo Kawaguchi <ryo@tonari.no>",
  "Matěj Laitl <matej@tonari.no>",
]
categories = ["command-line-utilities", "network-programming"]
description = "A server to coordinate innernet networks."
edition = "2021"
keywords.workspace = true
license = "MIT"
name = "innernet-server"
publish = true
readme = "../README.md"
repository = "https://github.com/tonarino/innernet"
version = "2.0.0"

[lib]
path = "src/lib.rs"

[[bin]]
name = "innernet-server"
path = "src/main.rs"

[features]
v6-test = []

[dependencies]
anyhow = "1"
bytes = "1"
clap = { version = "4.3", features = ["derive", "wrap_help"] }
clap_complete = "4.3"
colored.workspace = true
dialoguer.workspace = true
h3 = "0.0.8"
h3-quinn = "0.0.10"
# hyper 0.14 speaks the `http` of version 0.2, and h3 that of version 1.
http1 = { package = "http", version = "1" }
hyper = { version = "0.14", default-features = false, features = [
  "http1",
  "server",
  "runtime",
  "stream",
] }
indoc = "2.0.1"
innernet-publicip = { version = "2.0.0", path = "../publicip" }
innernet-client-core = { version = "2.0.0", path = "../client-core" }
innernet-node = { version = "2.0.0", path = "../node" }
innernet-shared = { version = "2.0.0", path = "../shared" }
ipnet = { version = "2.4", features = ["serde"] }
libc = "0.2"
log = "0.4"
parking_lot = "0.12"
pretty_env_logger = "0.4"
quinn = { version = "0.11.12", default-features = false, features = [
  "log",
  "runtime-tokio",
  "rustls-ring",
] }
rusqlite.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
thiserror = "1"
tokio = { version = "1.28.0", features = ["macros", "net", "rt-multi-thread", "time"] }
toml = "0.8.10"
url = "2"
wireguard-control = { version = "2.0.0", path = "../wireguard-control" }

[target.'cfg(target_os = "linux")'.dependencies]
socket2 = { version = "0.5.2", features = ["all"] }

[dev-dependencies]
anyhow = "1"
cbor-core = { version = "0.10", features = ["serde"] }
tempfile = "3"
tokio = { version = "1.28.0", features = ["io-util"] }

[package.metadata.deb]
assets = [
  [
    "target/release/innernet-server",
    "usr/bin/",
    "755",
  ],
  [
    "innernet-server@.service",
    "usr/lib/systemd/system/",
    "644",
  ],
  [
    "../doc/innernet-server.8.gz",
    "usr/share/man/man8/",
    "644",
  ],
  [
    "../doc/innernet-server.completions.zsh",
    "usr/share/zsh/site-functions/_innernet-server",
    "644",
  ],
  [
    "../doc/innernet-server.completions.bash",
    "etc/bash_completion.d/innernet-server",
    "644",
  ],
  [
    "../doc/innernet-server.completions.fish",
    "usr/share/fish/vendor_completions.d/innernet-server.fish",
    "644",
  ],
]
depends = "libc6, libgcc1, zlib1g, systemd"
maintainer = "tonari <hey@tonari.no>"
name = "innernet-server"
priority = "optional"
recommends = "wireguard"
section = "net"
