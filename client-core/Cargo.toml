[package]
authors = [
  "Jake McGinty <me@jakebot.org>",
  "Brian Schwind <brian@tonari.no>",
  "Ryo Kawaguchi <ryo@tonari.no>",
  "Matěj Laitl <matej@tonari.no>",
  "Marek Bernat <marek@tonari.no>",
]
categories = ["network-programming"]
description = "A core library to manage innernet network interfaces."
edition = "2021"
keywords.workspace = true
license = "MIT"
name = "innernet-client-core"
publish = true
readme = "../README.md"
repository = "https://github.com/tonarino/innernet"
version = "3.0.1"

[dependencies]
anyhow = "1"
bytes = "1"
colored.workspace = true
h3 = "0.0.8"
h3-quinn = "0.0.10"
http = "1"
hyper = { version = "0.14", default-features = false, features = [
  "client",
  "http1",
  "runtime",
  "tcp",
] }
indoc = "2.0.1"
innernet-node = { version = "3.0.0", path = "../node" }
innernet-shared = { version = "3.0.1", path = "../shared" }
ipnet = "2.4"
log = "0.4"
quinn = { version = "0.11.12", default-features = false, features = [
  "log",
  "runtime-tokio",
  "rustls-ring",
] }
rusqlite.workspace = true
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2"
tokio = { version = "1.28.0", features = ["macros", "net", "rt", "time"] }
wireguard-control = { version = "3.0.0", path = "../wireguard-control" }

[dev-dependencies]
once_cell = "1.17.1"
tempfile = "3"
env_logger = "0.7"
toml = "0.8.10"
