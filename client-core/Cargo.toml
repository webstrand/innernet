[package]
authors = [
  "Jake McGinty <me@jakebot.org>",
  "Brian Schwind <brian@tonari.no>",
  "Ryo Kawaguchi <ryo@tonari.no>",
  "Matěj Laitl <matej@tonari.no>",
  "Marek Bernat <marek@tonari.no>",
]
categories = ["network-programming"]
description = "A core library to manage innernet network interfaces."
edition = "2021"
keywords.workspace = true
license = "MIT"
name = "innernet-client-core"
publish = true
readme = "../README.md"
repository = "https://github.com/tonarino/innernet"
version = "2.0.0"

[dependencies]
anyhow = "1"
colored.workspace = true
hyper = { version = "0.14", default-features = false, features = ["client", "http1", "runtime", "tcp"] }
innernet-node = { version = "2.0.0", path = "../node" }
innernet-shared = { version = "2.0.0", path = "../shared" }
ipnet = "2.4"
log = "0.4"
rusqlite.workspace = true
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2"
tokio = { version = "1.28.0", features = ["macros", "rt", "time"] }
wireguard-control = { version = "2.0.0", path = "../wireguard-control" }

[dev-dependencies]
tokio = { version = "1.28.0", features = ["macros", "rt"] }
once_cell = "1.17.1"
tempfile = "3"
env_logger = "0.7"

[features]
selinux = ["innernet-shared/selinux"]
