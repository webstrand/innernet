[package]
authors = [
  "Jake McGinty <me@jakebot.org>",
  "Brian Schwind <brian@tonari.no>",
  "Ryo Kawaguchi <ryo@tonari.no>",
  "Matěj Laitl <matej@tonari.no>",
  "Marek Bernat <marek@tonari.no>",
]
categories = ["network-programming"]
description = "A core library to manage innernet network interfaces."
edition = "2021"
keywords.workspace = true
license = "MIT"
name = "innernet-client-core"
publish = true
readme = "../README.md"
repository = "https://github.com/tonarino/innernet"
version = "2.0.0"

[dependencies]
anyhow = "1"
colored.workspace = true
innernet-domain = { version = "2.0.0", path = "../domain" }
innernet-shared = { version = "2.0.0", path = "../shared" }
hickory-proto = { version = "0.26", default-features = false, features = ["std"] }
ipnet = { version = "2.4", features = ["serde"] }
log = "0.4"
regex = { version = "1", default-features = false, features = ["std"] }
rustls = { version = "0.23", default-features = false, features = ["std"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2"
ureq = { version = "2", default-features = false, features = ["json", "tls"] }
wireguard-control = { version = "2.0.0", path = "../wireguard-control" }

[dev-dependencies]
once_cell = "1.17.1"
tempfile = "3"
env_logger = "0.7"
toml = "0.8.10"

[features]
selinux = ["innernet-shared/selinux"]
