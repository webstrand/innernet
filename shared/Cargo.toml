[package]
authors = [
  "Jake McGinty <me@jakebot.org>",
  "Brian Schwind <brian@tonari.no>",
  "Ryo Kawaguchi <ryo@tonari.no>",
  "Matěj Laitl <matej@tonari.no>",
]
categories = ["network-programming"]
description = "Library utilities shared between innernet (client) and innernet-server"
edition = "2021"
keywords.workspace = true
license = "MIT"
name = "innernet-shared"
publish = true
readme = "../README.md"
repository = "https://github.com/tonarino/innernet"
version = "2.0.0"

[dependencies]
anyhow = "1"
atty = "0.2"
base64 = "0.22"
cbor-core = { version = "0.10", features = ["serde"] }
clap = { version = "4.3", features = ["derive", "wrap_help"] }
colored.workspace = true
curve25519-dalek = "4"
dialoguer.workspace = true
indoc = "2.0.1"
innernet-domain = { version = "2.0.0", path = "../domain" }
innernet-publicip = { version = "2.0.0", path = "../publicip" }
ipnet = { version = "2.4", features = ["serde"] }
libc = "0.2"
log = "0.4"
mime = "0.3.17"
once_cell = "1.17.1"
rand_core = { version = "0.6", features = ["getrandom"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging"] }
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
toml = "0.8.10"
url = "2"
wireguard-control = { version = "2.0.0", path = "../wireguard-control" }
zeroize = "1"

[target.'cfg(target_os = "linux")'.dependencies]
netlink-packet-core.workspace = true
netlink-packet-route.workspace = true
netlink-request = { version = "2.0.0", path = "../netlink-request" }
netlink-sys.workspace = true

[target.'cfg(any(target_os = "macos", target_os= "openbsd"))'.dependencies]
nix = "0.26"

[dev-dependencies]
rustls-webpki = { version = "0.103", default-features = false, features = ["ring", "std"] }
serde_json = "1"
wireguard-control = { version = "2.0.0", path = "../wireguard-control", features = ["test-util"] }

